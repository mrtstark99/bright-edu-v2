name: Deploy to Tenten

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ftp-deploy
  cancel-in-progress: false

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The host's FTPS cert is issued for the Tenten hostname, and the domain
      # only has an IPv6 (AAAA) record — which GitHub runners can't reach.
      # So connect via the Tenten hostname (cert stays valid) mapped to the
      # server's IPv4 address.
      - name: Map FTP host to IP
        run: echo "${{ secrets.FTP_IP }} ftp.oih1qyce8l.tenten.vn" | sudo tee -a /etc/hosts

      - name: FTPS deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.oih1qyce8l.tenten.vn
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps          # explicit FTPS over port 21
          port: 21
          local-dir: ./
          server-dir: ./   # this FTP account lands directly in the web root
          # Never overwrite live data/uploads or push VCS/CI noise:
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/README.md
            database/**
            uploads/**
            config/local.php
            **/.env
