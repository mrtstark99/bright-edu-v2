name: Deploy to Tenten

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ftp-deploy
  cancel-in-progress: false

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: FTPS deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.brighteducation.net
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps          # explicit FTPS over port 21
          port: 21
          local-dir: ./
          server-dir: public_html/   # Main Domain document root
          # Never overwrite live data/uploads or push VCS/CI noise:
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/README.md
            database/**
            uploads/**
            config/local.php
            **/.env
